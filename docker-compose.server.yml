services:
  nexora:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /root/nexora.env
    environment:
      NODE_ENV: production
      PORT: 3000
      PREMIUM_ADMIN_PHONE: ${PREMIUM_ADMIN_PHONE:?set PREMIUM_ADMIN_PHONE}
      PREMIUM_ADMIN_PHONES: ${PREMIUM_ADMIN_PHONES:-}
      NEXORA_ORIGIN: ${NEXORA_ORIGIN:?set NEXORA_ORIGIN}
    volumes:
      - nexora-data:/app/data
    ports:
      - "4000:3000"
    networks:
      default: {}
      dokploy-network:
        aliases:
          - nexora
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  nexora-data:

networks:
  dokploy-network:
    external: true
