services:
  proxy:
    image: caddy:2-alpine
    profiles: ["online"]
    restart: unless-stopped
    environment:
      NEXORA_DOMAIN: ${NEXORA_DOMAIN:?set NEXORA_DOMAIN for online profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nexora-caddy:/data
    depends_on:
      - web
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://nexora:nexora@postgres:5432/nexora
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${NEXORA_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: apps/web
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      VITE_BACKEND_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexora-redis:/data
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexora
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nexora-minio:/data
volumes:
  nexora-postgres:
  nexora-redis:
  nexora-minio:
  nexora-caddy:
