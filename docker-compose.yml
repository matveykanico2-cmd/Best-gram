services:
  proxy:
    image: caddy:2-alpine
    profiles: ["online"]
    restart: unless-stopped
    environment:
      RETRYNET_DOMAIN: ${RETRYNET_DOMAIN:?set RETRYNET_DOMAIN for online profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - retrynet-caddy:/data
    depends_on:
      - web
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://retrynet:retrynet@postgres:5432/retrynet
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: apps/web
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      VITE_BACKEND_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrynet
      POSTGRES_USER: retrynet
      POSTGRES_PASSWORD: retrynet
    ports:
      - "5432:5432"
    volumes:
      - retrynet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrynet -d retrynet"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - retrynet-redis:/data
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: retrynet
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - retrynet-minio:/data
volumes:
  retrynet-postgres:
  retrynet-redis:
  retrynet-minio:
  retrynet-caddy:
